name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Madeira
    runs-on: macos-14

    steps:
      - name: Checkout Madeira + submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show toolchain
        run: |
          echo "macOS:"
          sw_vers

          echo "Xcode:"
          xcodebuild -version

          echo "SDK:"
          xcrun --sdk iphoneos --show-sdk-version

      - name: Descargar archivos de Visual C++
        run: |
          brew install sevenzip
          curl -L -o vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          7zz x vc_redist.x64.exe -o/tmp/vcredist
          # Buscamos el archivo .cab dinámicamente y lo extraemos
          CAB_FILE=$(find /tmp/vcredist -name "*.cab" | head -n 1)
          echo "Archivo CAB encontrado en: $CAB_FILE"
          7zz x "$CAB_FILE" -oapp/Madeira/x86_64-vcruntime -y

      - name: Build native dependencies
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          found=0

          for dir in build/*/; do
            if [ -f "${dir}build.sh" ]; then
              found=1

              echo "========================================"
              echo "Building: $dir"
              echo "========================================"

              (
                cd "$dir"
                chmod +x build.sh
                ./build.sh
              )
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "ERROR: No native dependency build.sh files found."
            exit 1
          fi

      - name: Build Madeira
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          echo "Available schemes:"
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -list

          echo "Building iOS application..."

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            -derivedDataPath "$PWD/build/DerivedData" \
            build

      - name: Verify application
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find build/Release-iphoneos \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -n 1)"

          if [ -z "$APP" ]; then
            echo "ERROR: Madeira.app was not generated."
            echo "Build directory:"
            find build -maxdepth 4 -print
            exit 1
          fi

          echo "Application found:"
          echo "$APP"

          echo "Application contents:"
          du -sh "$APP"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf Payload Madeira.ipa
          mkdir -p Payload

          APP="$(find build/Release-iphoneos \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -n 1)"

          if [ -z "$APP" ]; then
            echo "ERROR: No .app found."
            exit 1
          fi

          cp -R "$APP" Payload/

          echo "Creating IPA..."
          ditto -c -k --sequesterRsrc --keepParent \
            Payload \
            Madeira.ipa

          echo "IPA created:"
          ls -lh Madeira.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-App
          path: Madeira.ipa
          if-no-files-found: error
          retention-days: 7
